name: Update Cyclone Track

on:
  schedule:
    # Run automatically every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  fetch-latest-track:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run IMD Bulletin Scraper
        run: |
          python3 scripts/fetch_imd.py

      - name: Commit and push if updated
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Cyclone Bot"
          git add data/latest_cyclone.json
          if git diff --staged --quiet; then
            echo "No new cyclone updates detected."
          else
            git commit -m "Auto-update IMD Cyclone Advisory [skip ci]"
            git push
          fi

